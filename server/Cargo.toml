[package]
name = "starryhoot-server"
version = "0.1.0"
description = "StarryHoot Server"
authors = ["@rustytsuki"]
edition = "2021"

[[bin]]
name = "starryhoot-server"
path = "src/main.rs"

[features]
# this feature is used for production builds
# DO NOT REMOVE!!
production = ["dep:rust-embed"]

[dependencies]
lazy_static = "1.4.0"
axum = {version = "0.7.4", features = ["multipart"]}
http-body-util = "0.1.0"
hyper = {version = "1.1.0", features = ["full"]}
hyper-util = { version = "0.1.1", features = ["client-legacy"] }
tokio = {version = "1.19.2", features = ["full"]}
tokio-stream = "0.1.9"
futures = { version = "0.3", default-features = false }
tracing = "0.1"
tracing-subscriber = {version = "0.3", features = ["env-filter"]}
tower-http = { version = "0.5.1", features = ["fs"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tini = "1.3"
clap = { version = "3", features = ["derive"] }
sqlx = { version = "0.7.3", features = [ "runtime-tokio-rustls", "sqlite" ] }
axum_session = { version = "0.12.4", features = [ "sqlite-rustls"], default-features = false }
sha-crypt = "0.5"
async-trait = "0.1.56"
zip = { version = "0.6.6", features = ["deflate"], default-features = false }
rust-embed = { version = "8.2", features = ["include-exclude"], optional = true }
mime_guess = "2.0"
percent-encoding = "2.1"
regex = "1.10.3"
dirs = "6.0.0"

[build-dependencies]
embed-resource = "3.0"