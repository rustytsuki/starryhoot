name: Publish Website

on:
    workflow_dispatch:
        inputs:
            tag:
                description: 'Publish Website'
                required: true
                type: string

    workflow_call:
        inputs:
            tag:
                description: 'Publish Website'
                required: true
                type: string
        secrets:
            STARRYHOOT_RELEASE:
                required: true

permissions:
    contents: read
    pages: write
    id-token: write

jobs:
    build-website:
        runs-on: ubuntu-24.04

        steps:
            - name: Call GitHub API to delete Pages site
              run: |
                  curl -L \
                      -X DELETE \
                      -H "Accept: application/vnd.github+json" \
                      -H "Authorization: Bearer ${{secrets.STARRYHOOT_RELEASE}}" \
                      -H "X-GitHub-Api-Version: 2022-11-28" \
                      https://api.github.com/repos/${{github.repository}}/pages

            - name: Call GitHub API to create Pages site
              run: |
                  curl -L \
                      -X POST \
                      -H "Accept: application/vnd.github+json" \
                      -H "Authorization: Bearer ${{secrets.STARRYHOOT_RELEASE}}" \
                      -H "X-GitHub-Api-Version: 2022-11-28" \
                      https://api.github.com/repos/${{github.repository}}/pages \
                      -d '{"build_type": "workflow"}'

            - name: Checkout repo
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.inputs.tag }}

            - name: Set up Node
              uses: actions/setup-node@v4
              with:
                  node-version: 20

            - name: Install dependencies
              run: |
                  cd deploy && npm ci && cd ..
                  cd web && npm ci && cd ..

            - name: Extract tag version
              id: extract_version
              env:
                  TAG_NAME: ${{ inputs.tag || github.event.inputs.tag }}
              run: |
                  echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_ENV"

                  VERSION="${TAG_NAME#v}"
                  IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

                  if [ -z "$MAJOR" ] || [ -z "$MINOR" ] || [ -z "$PATCH" ]; then
                    echo "Invalid version format: $VERSION"
                    exit 1
                  fi

                  echo "VERSION_MAJOR=$MAJOR" >> "$GITHUB_ENV"
                  echo "VERSION_MINOR=$MINOR" >> "$GITHUB_ENV"
                  echo "VERSION_PATCH=$PATCH" >> "$GITHUB_ENV"

            - name: Run publish script for Website
              working-directory: ./deploy
              env:
                  GH_TOKEN: ${{ secrets.STARRYHOOT_RELEASE }}
                  VERSION_MAJOR: ${{ env.VERSION_MAJOR }}
                  VERSION_MINOR: ${{ env.VERSION_MINOR }}
                  VERSION_PATCH: ${{ env.VERSION_PATCH }}
              run: |
                  npm run www:publish

            - name: Setup GitHub Pages
              uses: actions/configure-pages@v5

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  name: website-pages
                  path: ./web/dist/client

            - name: Deploy to GitHub Pages
              uses: actions/deploy-pages@v4
              with:
                  artifact_name: website-pages
